<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS HOST — تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080810;--bg2:#0d0d1c;--bg3:#12121f;
  --accent:#6366f1;--accent2:#818cf8;--cyan:#22d3ee;
  --green:#22d3ee;--red:#f43f5e;
  --border:rgba(99,102,241,0.15);--border2:rgba(99,102,241,0.35);
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
}
body{font-family:'Tajawal','Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

.login-wrap{position:relative;z-index:1;width:100%;max-width:460px;padding:20px;animation:up .5s ease-out}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* Logo top */
.login-logo{text-align:center;margin-bottom:32px}
.logo-ring{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,var(--accent),#4f46e5);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:1.8rem;font-weight:900;color:#fff;box-shadow:0 0 40px rgba(99,102,241,.5)}
.login-logo h1{font-size:1.5rem;font-weight:800;letter-spacing:.5px}
.login-logo h1 span{color:var(--accent2)}
.login-logo p{font-size:.82rem;color:var(--text3);margin-top:4px}

/* Card */
.card{background:rgba(13,13,28,.9);border:1px solid var(--border);border-radius:20px;padding:36px 32px;backdrop-filter:blur(24px);box-shadow:0 32px 80px rgba(0,0,0,.6)}
.card:hover{border-color:var(--border2);transition:border-color .3s}

/* Tabs */
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.4);border-radius:10px;padding:4px;margin-bottom:28px;border:1px solid var(--border)}
.tab{flex:1;padding:10px;border-radius:8px;border:none;background:transparent;color:var(--text3);font-family:'Tajawal',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.tab.active{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.4)}
.tab:not(.active):hover{color:var(--text2);background:rgba(255,255,255,.04)}

/* Form */
.form-section{display:none}.form-section.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

.field{margin-bottom:18px}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.input-wrap{position:relative}
.inp{width:100%;background:rgba(0,0,0,.5);border:1px solid var(--border);border-radius:10px;padding:13px 18px 13px 46px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:.92rem;outline:none;transition:.2s}
.inp:focus{border-color:var(--accent2);background:rgba(99,102,241,.05);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.inp::placeholder{color:var(--text3)}
.inp-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.9rem;transition:.2s;pointer-events:none}
.inp:focus + .inp-icon{color:var(--accent2)}
.eye-btn{position:absolute;left:16px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:.9rem;padding:4px;transition:.2s}
.eye-btn:hover{color:var(--text2)}

/* Alert */
.alert{display:none;align-items:center;gap:10px;border-radius:10px;padding:12px 16px;font-size:.85rem;margin-bottom:18px;animation:fade .2s}
.alert.show{display:flex}
.alert.error{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.25);color:#fb7185}
.alert.success{background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);color:#67e8f9}

/* Submit */
.submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),#4f46e5);border:none;border-radius:10px;color:#fff;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:.25s;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 24px rgba(99,102,241,.4)}
.submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 32px rgba(99,102,241,.55)}
.submit:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* Divider */
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:.75rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* Plan preview */
.free-plan{background:rgba(99,102,241,.06);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;margin-bottom:20px}
.free-plan h4{font-size:.88rem;font-weight:700;color:var(--accent2);margin-bottom:10px}
.free-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:100px;padding:4px 12px;font-size:.75rem;color:var(--text2)}

/* Spinner */
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rotate .7s linear infinite;display:none}
@keyframes rotate{to{transform:rotate(360deg)}}

/* footer note */
.auth-footer{text-align:center;margin-top:20px;font-size:.78rem;color:var(--text3)}
.auth-footer a{color:var(--accent2);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="login-wrap">
  <div class="login-logo">
    <div class="logo-ring">M</div>
    <h1>MS <span>HOST</span></h1>
    <p>منصة استضافة سحابية احترافية</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="switchTab('login')"><i class="fas fa-sign-in-alt"></i> تسجيل دخول</button>
      <button class="tab" id="registerTab" onclick="switchTab('register')"><i class="fas fa-user-plus"></i> حساب جديد</button>
    </div>

    <!-- LOGIN -->
    <div class="form-section active" id="loginForm">
      <div class="alert error" id="loginError"><i class="fas fa-circle-xmark"></i> <span id="loginErrMsg"></span></div>
      <div class="alert success" id="loginSuccess"><i class="fas fa-circle-check"></i> <span id="loginOkMsg"></span></div>
      <div class="field">
        <label>اسم المستخدم</label>
        <div class="input-wrap">
          <input class="inp" id="loginEmail" type="text" placeholder="أدخل بريدك الإلكتروني" autocomplete="username">
          <i class="fas fa-at inp-icon"></i>
        </div>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <div class="input-wrap">
          <input class="inp" id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
          <i class="fas fa-lock inp-icon"></i>
          <button class="eye-btn" type="button" onclick="togglePass('loginPass',this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button class="submit" id="loginBtn" onclick="doLogin()">
        <div class="spin" id="loginSpin"></div>
        <i class="fas fa-arrow-left" id="loginIcon"></i>
        <span id="loginBtnTxt">دخول</span>
      </button>
    </div>

    <!-- REGISTER -->
    <div class="form-section" id="registerForm">
      <div class="free-plan">
        <h4><i class="fas fa-gift"></i> الخطة المجانية — مجاناً للأبد</h4>
        <div class="free-chips">
          <span class="chip"><i class="fas fa-server"></i> 5 سيرفرات</span>
          <span class="chip"><i class="fas fa-database"></i> 100 GB</span>
          <span class="chip"><i class="fas fa-microchip"></i> 512 MB RAM</span>
        </div>
      </div>
      <div class="alert error" id="regError"><i class="fas fa-circle-xmark"></i> <span id="regErrMsg"></span></div>
      <div class="alert success" id="regSuccess"><i class="fas fa-circle-check"></i> <span id="regOkMsg"></span></div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <div class="input-wrap">
          <input class="inp" id="regEmail" type="email" placeholder="you@example.com" autocomplete="email">
          <i class="fas fa-at inp-icon"></i>
        </div>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <div class="input-wrap">
          <input class="inp" id="regPass" type="password" placeholder="٤ أحرف على الأقل" autocomplete="new-password">
          <i class="fas fa-lock inp-icon"></i>
          <button class="eye-btn" type="button" onclick="togglePass('regPass',this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button class="submit" id="regBtn" onclick="doRegister()">
        <div class="spin" id="regSpin"></div>
        <i class="fas fa-user-plus" id="regIcon"></i>
        <span id="regBtnTxt">إنشاء الحساب</span>
      </button>
    </div>
  </div>

  <p class="auth-footer">بالاستمرار، أنت توافق على <a href="#">شروط الخدمة</a> و<a href="#">سياسة الخصوصية</a></p>
</div>

<script>
// canvas bg
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,pts=[];
function rsz(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
function mkPt(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()+.5,a:Math.random()*.3+.1}}
window.addEventListener('resize',()=>{rsz();pts=[];for(let i=0;i<80;i++)pts.push(mkPt())});
rsz();for(let i=0;i<80;i++)pts.push(mkPt());
(function loop(){
  ctx.clearRect(0,0,W,H);
  pts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(99,102,241,${p.a})`;ctx.fill();
  });
  requestAnimationFrame(loop);
})();

function switchTab(t){
  document.getElementById('loginTab').classList.toggle('active',t==='login');
  document.getElementById('registerTab').classList.toggle('active',t==='register');
  document.getElementById('loginForm').classList.toggle('active',t==='login');
  document.getElementById('registerForm').classList.toggle('active',t==='register');
  hideAlerts();
}
function togglePass(id,btn){
  const inp=document.getElementById(id);
  inp.type=inp.type==='password'?'text':'password';
  btn.querySelector('i').className='fas fa-eye'+(inp.type==='text'?'-slash':'');
}
function setLoading(btnId,spinId,iconId,on){
  document.getElementById(btnId).disabled=on;
  document.getElementById(spinId).style.display=on?'block':'none';
  document.getElementById(iconId).style.display=on?'none':'inline';
}
function showAlert(id,msg){const el=document.getElementById(id);const txt=el.querySelector('span');if(txt)txt.textContent=msg;el.classList.add('show');}
function hideAlerts(){['loginError','loginSuccess','regError','regSuccess'].forEach(id=>{document.getElementById(id).classList.remove('show')});}

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  if(!email||!pass){showAlert('loginError','الرجاء إدخال جميع البيانات');return;}
  setLoading('loginBtn','loginSpin','loginIcon',true);
  document.getElementById('loginBtnTxt').textContent='جاري الدخول...';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const d=await r.json();
    if(d.success){showAlert('loginSuccess','تم تسجيل الدخول، جاري التوجيه...');setTimeout(()=>location.href=d.redirect||'/dashboard',600);}
    else{showAlert('loginError',d.message||'بيانات غير صحيحة');setLoading('loginBtn','loginSpin','loginIcon',false);document.getElementById('loginBtnTxt').textContent='دخول';}
  }catch(e){showAlert('loginError','خطأ في الاتصال');setLoading('loginBtn','loginSpin','loginIcon',false);document.getElementById('loginBtnTxt').textContent='دخول';}
}

async function doRegister(){
  const email=document.getElementById('regEmail').value.trim();
  const pass=document.getElementById('regPass').value;
  if(!email||!pass){showAlert('regError','الرجاء إدخال جميع البيانات');return;}
  if(!email.includes('@')){showAlert('regError','البريد الإلكتروني غير صالح');return;}
  if(pass.length<4){showAlert('regError','كلمة المرور قصيرة جداً');return;}
  setLoading('regBtn','regSpin','regIcon',true);
  document.getElementById('regBtnTxt').textContent='جاري الإنشاء...';
  try{
    const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const d=await r.json();
    if(d.success){showAlert('regSuccess',d.message||'تم إنشاء الحساب بنجاح!');setTimeout(()=>switchTab('login'),1500);}
    else{showAlert('regError',d.message||'فشل الإنشاء');}
    setLoading('regBtn','regSpin','regIcon',false);
    document.getElementById('regBtnTxt').textContent='إنشاء الحساب';
  }catch(e){showAlert('regError','خطأ في الاتصال');setLoading('regBtn','regSpin','regIcon',false);document.getElementById('regBtnTxt').textContent='إنشاء الحساب';}
}

// Enter key
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(document.getElementById('loginForm').classList.contains('active'))doLogin();
    else doRegister();
  }
});
</script>
</body>
</html>
